<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phext-vr — layer text into 3D scenes</title>
<style>
  /* House rule: dark mode follows the OS by default; the toggle in the HUD
     is the visitor's explicit override and is persisted (src/app.js).
     Metallic Golden Phext accents: flat gold, never a gradient. */
  :root {
    --gold-dark: hsl(43, 95%, 55%);
    --gold-light: hsl(43, 89%, 38%);
  }
  html[data-theme="dark"]  { --bg:#0b0b10; --ink:#e9e5d9; --dim:#8f8a7c; --gold:var(--gold-dark);  --panel:#17171f; --line:#33333f; }
  html[data-theme="light"] { --bg:#e9e5da; --ink:#1d1a13; --dim:#6f6a5c; --gold:var(--gold-light); --panel:#f7f3e8; --line:#c9c2ae; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.45 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; overflow:hidden; }
  #scene { position:fixed; inset:0; }
  #scene canvas { display:block; }
  #hud {
    position:fixed; top:12px; left:12px; z-index:10; max-width:min(430px, calc(100vw - 24px));
    background:var(--panel); border:1px solid var(--gold); padding:12px 14px;
  }
  #hud h1 { font-size:17px; margin:0 0 2px; color:var(--gold); letter-spacing:.04em; }
  #hud .sub { color:var(--dim); font-size:12px; margin-bottom:10px; }
  #hud .row { display:flex; flex-wrap:wrap; gap:6px; margin:7px 0; align-items:center; }
  #hud label { color:var(--dim); font-size:12px; }
  #hud select, #hud button {
    font:inherit; font-size:12.5px; color:var(--ink); background:transparent;
    border:1px solid var(--line); padding:4px 8px; cursor:pointer;
  }
  #hud select:focus, #hud button:hover { border-color:var(--gold); color:var(--gold); }
  #hud .file { position:relative; overflow:hidden; }
  #hud .file input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  #status, #mapping-note, #selected-note { font-size:12px; color:var(--dim); margin-top:6px; overflow-wrap:anywhere; }
  #selected-note { color:var(--ink); }
  #hud .keys { font-size:11.5px; color:var(--dim); border-top:1px solid var(--line); margin-top:9px; padding-top:8px; }
  kbd { border:1px solid var(--line); padding:0 4px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/",
    "libphext": "./vendor/libphext.js"
  }
}
</script>
</head>
<body>
<div id="scene"></div>

<div id="hud">
  <h1>phext-vr</h1>
  <div class="sub">layer text into 3D scenes — a phext, projected from 9D to 3D</div>

  <div class="row">
    <label for="projection">projection</label>
    <select id="projection">
      <option value="lattice">Lattice Room — 3D grid tiling</option>
      <option value="shell">Scroll Shell — concentric spheres</option>
    </select>
    <button id="frame-all" type="button">frame all</button>
    <button id="theme-toggle" type="button">theme</button>
  </div>

  <div class="row">
    <span class="file"><button type="button">load .phext…</button><input id="load-file" type="file" accept=".phext,.txt,text/plain"></span>
    <button id="export-mapping" type="button">export mapping</button>
    <span class="file"><button type="button">import mapping…</button><input id="import-mapping" type="file" accept=".json,application/json"></span>
    <button id="reset-mapping" type="button">reset mapping</button>
  </div>

  <div class="row">
    <button id="page-prev" type="button">◀ page</button>
    <button id="page-next" type="button">page ▶</button>
    <span id="selected-note">no scroll selected — click one</span>
  </div>

  <div id="status">loading the sample corpus…</div>
  <div id="mapping-note"></div>

  <div class="keys">
    drag&nbsp;=&nbsp;slide a scroll · <kbd>Alt</kbd>+drag&nbsp;=&nbsp;turn it · wheel over a scroll&nbsp;=&nbsp;turn its pages ·
    drag empty space&nbsp;=&nbsp;orbit · in VR: point, squeeze to grab, release to set down
  </div>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
